name: Publish Instagram Carousel

on:
  workflow_dispatch:
    inputs:
      folder:
        description: "Folder under assets/ (e.g. gold-2026-09-18)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          node publish.js "${{ github.event.inputs.folder }}" "${{ github.repository_owner }}" "${{ github.event.repository.name }}" "${{ github.ref_name }}"
